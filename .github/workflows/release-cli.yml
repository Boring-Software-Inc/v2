name: release cli

on:
  workflow_dispatch:
    inputs:
      channel:
        description: npm release channel
        type: choice
        options: [latest, staging]
        default: latest
      bump:
        description: patch, minor, major, or an exact x.y.z
        required: true
        default: patch
  push:
    branches:
      - main
      - staging
    tags:
      - "cli-v*"
    paths:
      - "apps/cli/**"
      - "packages/contracts/**"
      - "scripts/cli-release/**"
      - ".github/workflows/release-cli.yml"

concurrency:
  group: release-cli
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.ref_type != 'tag' || !contains(github.ref_name, '-staging.')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile

      - name: Select channel
        id: channel
        env:
          CHANNEL: ${{ inputs.channel || (github.ref_name == 'staging' && 'staging' || 'latest') }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$CHANNEL:$REF_TYPE:$REF_NAME" in
            latest:branch:main|latest:tag:cli-v*) ;;
            staging:branch:staging) ;;
            *) echo "Release channel does not match the selected ref" >&2; exit 1 ;;
          esac
          echo "name=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Check
        run: |
          bun --filter '@tripwire-sh/cli' typecheck
          bun test apps/cli scripts/cli-release

      - name: Pick the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BUMP: ${{ github.event.inputs.bump }}
          CHANNEL: ${{ steps.channel.outputs.name }}
        run: |
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            bun run scripts/cli-release/prepare.ts tag "$REF_NAME"
          else
            bun run scripts/cli-release/prepare.ts bump "${BUMP:-patch}" "$CHANNEL"
          fi

      - name: Build and pack
        id: package
        working-directory: apps/cli
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun run build
          test "$(node dist/tripwire.js --version)" = "$VERSION"
          archive="$(npm pack --quiet)"
          echo "archive=$PWD/$archive" >> "$GITHUB_OUTPUT"
          expected_bin=tripwire
          if [[ "$VERSION" == *-staging.* ]]; then expected_bin=tripwire-staging; fi
          test "$(node -p 'Object.keys(require("./package.json").bin).join(",")')" = "$expected_bin"

      - name: Verify the packed CLI with the channel SDK
        env:
          CHANNEL: ${{ steps.channel.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
          TRIPWIRE_TEST_CLI_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          smoke="$(mktemp -d)"
          sdk_tag=latest
          bin=tripwire
          if [[ "$CHANNEL" == staging ]]; then
            export TRIPWIRE_ENV=staging
            bin=tripwire-staging
            sdk_tag=staging
          fi
          for attempt in {1..12}; do
            if sdk_archive="$(npm pack "@tripwire-sh/sdk@$sdk_tag" --prefer-online --pack-destination "$smoke" --quiet)"; then
              break
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "::error::Could not download @tripwire-sh/sdk@$sdk_tag. Check the SDK release before publishing the CLI."
              exit 1
            fi
            sleep 20
          done
          echo "Testing with $sdk_archive"
          export TRIPWIRE_TEST_SDK_ARCHIVE="$smoke/$sdk_archive"
          npm install --prefix "$smoke" "$TRIPWIRE_TEST_CLI_ARCHIVE"
          test "$("$smoke/node_modules/.bin/$bin" --version)" = "$VERSION"
          bun test apps/cli/src/workflow-sdk-roundtrip.test.ts

      - name: Publish to npm
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHANNEL: ${{ steps.channel.outputs.name }}
        run: npm publish "$ARCHIVE" --provenance --access public --tag "$CHANNEL"

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.channel.outputs.name }}
        run: |
          tag="cli-v$VERSION"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git tag "$tag"
            git push origin "$tag"
          fi
          if [ "$CHANNEL" = "staging" ]; then
            gh release create "$tag" --prerelease --title "@tripwire-sh/cli $VERSION" --notes "Staging CLI: npx @tripwire-sh/cli@staging --help"
            exit 0
          fi
          previous=$(git tag --list 'cli-v*' --sort=-v:refname | grep -E '^cli-v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$tag" | head -1)
          range=${previous:+$previous..}$tag
          notes=$(git log --format='- %s' "$range" -- apps/cli packages/contracts/src/setup.ts)
          gh release create "$tag" --title "@tripwire-sh/cli $VERSION" --notes "${notes:-- maintenance release}" || gh release edit "$tag" --notes "${notes:-- maintenance release}"
