name: release cli

on:
  workflow_dispatch:
    inputs:
      channel:
        description: npm release channel
        type: choice
        options: [latest, staging]
        default: latest
      bump:
        description: patch, minor, major, or an exact x.y.z
        required: true
        default: patch
  push:
    branches:
      - main
    tags:
      - "cli-v*"
    paths:
      - "apps/cli/**"
      - "packages/contracts/**"

concurrency:
  group: release-cli
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile

      - name: Select channel
        id: channel
        env:
          CHANNEL: ${{ github.event.inputs.channel || 'latest' }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$CHANNEL:$REF_TYPE:$REF_NAME" in
            latest:branch:main|latest:tag:cli-v*) ;;
            staging:branch:staging/visual) ;;
            *) echo "Release channel does not match the selected ref" >&2; exit 1 ;;
          esac
          echo "name=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Check
        run: |
          bunx tsc --noEmit -p apps/cli
          bun test apps/cli scripts/cli-release

      - name: Pick the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BUMP: ${{ github.event.inputs.bump }}
          CHANNEL: ${{ steps.channel.outputs.name }}
        run: |
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            bun run scripts/cli-release/prepare.ts tag "$REF_NAME"
          else
            bun run scripts/cli-release/prepare.ts bump "${BUMP:-patch}" "$CHANNEL"
          fi

      - name: Build
        working-directory: apps/cli
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun run build
          test "$(node dist/tripwire.js --version)" = "$VERSION"
          npm pack --dry-run

      - name: Publish to npm
        working-directory: apps/cli
        env:
          CHANNEL: ${{ steps.channel.outputs.name }}
        run: npm publish --provenance --access public --tag "$CHANNEL"

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.channel.outputs.name }}
        run: |
          tag="cli-v$VERSION"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git tag "$tag"
            git push origin "$tag"
          fi
          if [ "$CHANNEL" = "staging" ]; then
            gh release create "$tag" --prerelease --title "@tripwire-sh/cli $VERSION" --notes "Staging CLI: npx @tripwire-sh/cli@staging --help"
            exit 0
          fi
          previous=$(git tag --list 'cli-v*' --sort=-v:refname | grep -E '^cli-v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$tag" | head -1)
          range=${previous:+$previous..}$tag
          notes=$(git log --format='- %s' "$range" -- apps/cli packages/contracts/src/setup.ts)
          gh release create "$tag" --title "@tripwire-sh/cli $VERSION" --notes "${notes:-- maintenance release}" || gh release edit "$tag" --notes "${notes:-- maintenance release}"
