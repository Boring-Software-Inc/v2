- main:
  - heading "Set up empty-repo" [level=1]
  - heading "Set up with your coding agent" [level=2]
  - button "Copy setup prompt"
  - button "Dismiss"
  - list "Setup steps":
    - listitem:
      - img "Done"
      - text: GitHub App installed
    - listitem:
      - text: Install rules
      - region "Rule packs":
        - list:
          - listitem:
            - text: Spam protection Recommended
            - paragraph: Account age, Rate limit, English only
            - button "Install Spam protection": Install pack
          - listitem:
            - text: Crypto scams
            - paragraph: Crypto address, Honeypot paths
            - button "Install Crypto scams": Install pack
          - listitem:
            - text: First-time contributors
            - paragraph: Merged change requests, Profile README
            - button "Install First-time contributors": Install pack
          - listitem:
            - text: Bulk changes
            - paragraph: Max files changed
            - button "Install Bulk changes": Install pack
    - listitem: Run first check
    - listitem: Pick what Tripwire posts