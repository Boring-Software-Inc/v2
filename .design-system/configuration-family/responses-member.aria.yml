- main:
  - heading "Responses" [level=1]
  - paragraph: Choose what Tripwire does after each workflow outcome.
  - status: Only org admins can change this
  - radiogroup "Outcome":
    - radio "Block" [checked]
    - radio "Ask author to fix"
    - radio "Human review"
    - radio "Note only"
    - radio "Close"
  - tablist "Blocks":
    - tab "Blocks" [selected]
    - tab "Settings" [disabled]
  - button "Hide blocks"
  - searchbox "Search blocks"
  - heading "Text" [level=3]:
    - button "Text" [expanded]
  - region "Text":
    - text: Headline
    - button "Add Headline" [disabled]
    - text: Verdict line
    - button "Add Verdict line" [disabled]
    - text: Instruction
    - button "Add Instruction" [disabled]
    - text: Free text
    - button "Add Free text" [disabled]
  - heading "Run details" [level=3]:
    - button "Run details" [expanded]
  - region "Run details":
    - text: Failed rules
    - button "Add Failed rules" [disabled]
    - text: Notes
    - button "Add Notes" [disabled]
    - text: AI review skipped
    - button "Add AI review skipped" [disabled]
    - text: Rerun note
    - button "Add Rerun note" [disabled]
  - heading "Links" [level=3]:
    - button "Links" [expanded]
  - region "Links":
    - text: View on Tripwire
    - button "Add View on Tripwire" [disabled]
    - text: How do I fix this?
    - button "Add How do I fix this?" [disabled]
  - region "Sample preview":
    - heading "Sample preview" [level=2]
    - combobox "Viewer": Outsider
    - combobox "Surface": PR comment
    - paragraph: Uses your current edits and sample run data. Empty blocks have no content in this sample.
    - article:
      - text: tripwire bot commented just now
      - list "Comment blocks":
        - listitem:
          - paragraph: "@contributor, Tripwire blocked this change request."
        - listitem:
          - list:
            - listitem:
              - strong: "Account age:"
              - text: Your account is too new for this repository.
            - listitem:
              - strong: "Crypto address:"
              - text: This change request adds crypto wallet addresses. Remove them.
        - listitem:
          - img "View on Tripwire"
  - status
  - region "Redaction":
    - heading "Redaction" [level=2]
    - paragraph: What people outside your org see.
    - checkbox "Use org defaults" [checked] [disabled]
    - text: Use org defaults Level Nothing hidden
    - group:
      - slider "Level" [disabled]: "0"
    - list "Hidden from people outside the org"
    - button "Where it applies 4 of 5"
    - checkbox "Show how to fix it" [checked] [disabled]
    - text: Show how to fix it How do I fix this?