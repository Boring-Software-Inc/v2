- main:
  - heading "Workflows" [level=1]
  - paragraph: "What this repo runs against change requests: triggers, rules, gates and actions."
  - button "Poke the ghost"
  - heading "No workflows yet" [level=3]
  - paragraph: Build one from scratch, or start from a template below.
  - button "Create workflow"
  - region "Templates":
    - heading "Templates" [level=2]
    - list "Templates":
      - listitem:
        - text: Block new accounts
        - paragraph: Blocks change requests from accounts less than a week old.
        - button "Use the Block new accounts template": Use template
      - listitem:
        - text: Lock inactive threads
        - paragraph: Every 12 hours, locks closed issues and change requests with no activity for 15 days.
        - button "Use the Lock inactive threads template": Use template
      - listitem:
        - text: Close stale issues
        - paragraph: Every 12 hours, warns on issues with no activity for 15 days and closes them 7 days later. A comment clears the warning.
        - button "Use the Close stale issues template": Use template
      - listitem:
        - text: Close stale change requests
        - paragraph: Warns after 3 weeks with no activity, closes a week later, and clears the warning on any update.
        - button "Use the Close stale change requests template": Use template